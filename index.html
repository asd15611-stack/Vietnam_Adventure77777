building(4,4,5,5,'#e5b34f','#b95d49','河內咖啡館','cafe');building(10,4,5,5,'#dfc47e','#608d78','傳統雜貨店','shop');building(27,4,5,5,'#e4a85d','#a64f47','法式老屋');building(33,4,5,5,'#e6d48f','#527f75','河內麵包店','bread');building(5,17,6,5,'#e6c075','#a45d49','民居');building(29,17,6,5,'#d8ad62','#a55c4b','傳統茶館','shop');

[[16,12,'cart'],[25,12,'flower'],[12,12,'bench'],[30,12,'bench'],[19,7,'lamp'],[23,17,'lamp']].forEach(a=>propAt(...a));
npc(10,11,'咖啡店阿姨','河內的早晨，最適合坐在街邊喝蛋咖啡。慢慢走，才能發現老城的味道。');npc(29,14,'麵包店老闆','法國麵包外皮酥脆，搭配香草和醃菜，是我們熟悉的街頭美食。','#467a73');
banners=[{x:7,y:9},{x:13,y:9},{x:29,y:9},{x:35,y:9}];exitAt(39,12,'sapa',3,12,'前往沙壩山村');
}else if(id==='sapa'){
theme={grass:'#74a477',stone:'#c6b18a',soil:'#ad9467',edge:'#3b6a54'};

world=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x>=2&&x<=39&&y>=2&&y<=23?'grass':'edge'));
for(let y=3;y<23;y++){let cx=y<9?11:y<15?11+(y-9)*2:y<20?23+(y-15):28;ground(cx-2,y,6,1,'stone')}
ground(2,11,37,3,'stone');ground(4,4,11,3,'soil');ground(27,17,11,5,'soil');ground(4,17,12,5,'soil');
building(5,5,7,4,'#c59a65','#614c3e','山村木屋');building(30,18,7,4,'#ba9871','#635243','織布工坊','shop');building(5,18,6,4,'#c7a579','#6e5742','梯田農家');
[[3,4],[16,4],[25,5],[35,6],[4,16],[16,19],[38,17],[38,22]].forEach(a=>treeAt(...a));
[[16,12,'flower'],[25,12,'cart'],[20,9,'flower'],[27,20,'flower']].forEach(a=>propAt(...a));
npc(14,11,'織布阿姨','沙壩的靛藍染布和刺繡，是代代相傳的手藝。','#7a5c98');npc(30,14,'梯田農夫','這裡的梯田依山而建，四季都有不同的風景。','#587d62');

}else if(id==='fansipan'){
theme={grass:'#899d96',stone:'#c1c5c0',soil:'#879c98',edge:'#647f87'};
world=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x>=2&&x<=39&&y>=2&&y<=23?'grass':'edge'));
// 高山：大面積岩坡、斜向登山步道、稀疏建築
for(let y=3;y<23;y++){let cx=Math.round(9+y*.85+Math.sin(y*.5)*3);ground(cx-2,y,6,1,'stone')}

building(7,5,8,4,'#d4d0bd','#71838c','高山纜車站','shop');building(30,18,7,4,'#d5d0c5','#667780','山頂休息站','cafe');
[[3,5],[36,5],[4,19],[38,20]].forEach(a=>treeAt(...a));[[17,12,'bench'],[28,12,'bench'],[24,8,'lamp']].forEach(a=>propAt(...a));
npc(14,11,'登山嚮導','這裡是番西邦高山，氣溫和能見度可能快速變化。','#52718d');npc(30,14,'纜車站員','雲海出現時，山巒會像浮在天空中。','#987352');
exitAt(2,12,'sapa',38,12,'返回沙壩');exitAt(39,12,'halong',3,12,'前往下龍灣');
}else if(id==='halong'){
theme={grass:'#83b1a4',stone:'#c5b8a0',soil:'#b6aa8b',edge:'#368ca0'};
// 港口：上半幅是海，右側碼頭突出至海面，岸上僅兩棟建築
world=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x>=2&&x<=39&&y>=2&&y<=23?(y<10?'water':'grass'):'edge'));
ground(2,11,38,4,'stone');ground(18,5,7,9,'wood');ground(5,17,11,5,'soil');ground(28,17,10,5,'soil');
for(let y=2;y<10;y++)for(let x=2;x<40;x++)if(world[y][x]==='water')block(x,y);
building(5,18,8,4,'#e4c78a','#658f91','港口服務站','shop');building(30,18,7,4,'#e1bb82','#5d8c91','港邊咖啡館','cafe');
[[3,17],[16,20],[27,20],[38,21]].forEach(a=>treeAt(...a));[[14,12,'cart'],[28,12,'bench'],[21,9,'lamp']].forEach(a=>propAt(...a));
npc(12,11,'港口導覽員','下龍灣的石灰岩島嶼，是海水與地質作用共同塑造的景色。','#438c91');npc(30,14,'漁村居民','在海灣裡，可以看到傳統漁船與海上生活的故事。','#9d7054');
exitAt(2,12,'fansipan',38,12,'返回番西邦');exitAt(39,12,'cruise',3,12,'登上郵輪');
}else if(id==='cruise'){
theme={grass:'#b6c4b9',stone:'#d1b995',soil:'#bba27d',edge:'#318399'};
// 郵輪：周圍全是海，中央是長條形木甲板與船艙
world=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x>=3&&x<=38&&y>=7&&y<=18?'wood':'water'));
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(world[y][x]==='water')block(x,y);

[[9,10,'bench'],[31,10,'bench'],[11,16,'flower'],[29,16,'flower'],[20,15,'lamp']].forEach(a=>propAt(...a));

for(let y=2;y<24;y++)for(let x=2;x<40;x++){let r=rnd(x,y,11);if(world[y][x]==='grass'&&r>.88&&!blocked.has(x+','+y))decor.push({x,y,kind:r>.95?'flowers':'tuft'});if(world[y][x]==='soil'&&r>.95&&!blocked.has(x+','+y))decor.push({x,y,kind:'pot'})}
// Only place villagers on valid, distinct walkable tiles.
const occupied=new Set();

 if(blocked.has(n.x+','+n.y)||occupied.has(n.x+','+n.y)){
  let found=null;
  for(let radius=1;radius<10&&!found;radius++)for(let dy=-radius;dy<=radius&&!found;dy++)for(let dx=-radius;dx<=radius;dx++){
   const xx=n.homeX+dx,yy=n.homeY+dy;
   if(xx>=2&&xx<=39&&yy>=2&&yy<=23&&!blocked.has(xx+','+yy)&&!occupied.has(xx+','+yy)&&world[yy]?.[xx]!=='water'){found=[xx,yy];break}
  }
  if(found){n.x=found[0];n.y=found[1]}
 }
 occupied.add(n.x+','+n.y);
 n.route=makePatrol(n);n.routeIndex=0;n.moveAt=performance.now()+900+n.seed*520;
}

// Deterministic short walking loops around each NPC's home position.
// Paths are searched over actual collision tiles, not drawn decorations.
function makePatrol(n){
 const points=[[n.x,n.y]];
 const candidates=[[2,0],[2,1],[0,2],[-2,1],[-2,0],[-1,-2],[1,-2]];
 for(const [dx,dy] of candidates){
  const x=n.x+dx,y=n.y+dy;
  if(Math.abs(x-n.homeX)+Math.abs(y-n.homeY)>5)continue;
  if(x<2||x>39||y<2||y>23||blocked.has(x+','+y)||world[y]?.[x]==='water')continue;
  points.push([x,y]);
  if(points.length===4)break;
 }
 return points.length>1?points:[points[0]];
}
function findNpcStep(n,tx,ty){
 const start=n.x+','+n.y,queue=[[n.x,n.y]],prev=new Map([[start,null]]);
 const occupied=new Set(npcs.filter(o=>o!==n).map(o=>o.x+','+o.y));
 occupied.add(player.x+','+player.y);
 for(let i=0;i<queue.length&&i<120;i++){
  const [x,y]=queue[i];if(x===tx&&y===ty)break;
  for(const [dx,dy] of [[0,1],[1,0],[-1,0],[0,-1]]){
   const xx=x+dx,yy=y+dy,k=xx+','+yy;
   if(xx<2||xx>39||yy<2||yy>23||blocked.has(k)||occupied.has(k)||prev.has(k)||world[yy]?.[xx]==='water')continue;
   prev.set(k,[x,y]);queue.push([xx,yy]);
  }
 }
 let key=tx+','+ty;if(!prev.has(key))return null;
 let current=[tx,ty];while(prev.get(current.join(','))&&prev.get(current.join(',')).join(',')!==start){current=prev.get(current.join(','))}
 return current;
}
function updateVillagers(now){
 if(dialog)return;
 for(const n of npcs){
  if(now<n.moveAt||now<n.waitUntil)continue;
  // Don't walk away while the player is trying to speak.
  if(Math.abs(n.x-player.x)+Math.abs(n.y-player.y)<=1){n.moveAt=now+900;continue}
  if(n.route.length<2){n.dir=['down','left','up','right'][Math.floor(now/1700+n.seed)%4];n.moveAt=now+1500;continue}
  let target=n.route[n.routeIndex];
  if(n.x===target[0]&&n.y===target[1]){
   n.routeIndex=(n.routeIndex+1)%n.route.length;
   n.waitUntil=now+650+(n.seed*319)%950;
   n.moveAt=n.waitUntil;continue;
  }
  const step=findNpcStep(n,target[0],target[1]);
  if(!step){n.routeIndex=(n.routeIndex+1)%n.route.length;n.moveAt=now+1100;continue}
  const dx=step[0]-n.x,dy=step[1]-n.y;
  n.dir=dx>0?'right':dx<0?'left':dy>0?'down':'up';
  n.x=step[0];n.y=step[1];n.walk++;
  n.moveAt=now+330+(n.seed%3)*65;
 }
}
function rnd(x,y,s=1){let n=Math.sin(x*127.1+y*311.7+s*79.7)*43758.5453;return n-Math.floor(n)}

function canMove(x,y){if(x<2||y<2||x>39||y>23||blocked.has(x+','+y))return false;return !npcs.some(n=>n.x===x&&n.y===y)}
function update(dt){if(dialog||combat||!document.getElementById('journal').hidden)return;updateVillagers(frameTime);stepAcc+=dt;let dirs=[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]];if(stepAcc>=105){for(const [d,dx,dy] of dirs)if(keys.has(d)){player.dir=d;if(canMove(player.x+dx,player.y+dy)){player.x+=dx;player.y+=dy;player.walk++;tryWildEncounter();let e=exits.find(e=>e.x===player.x&&e.y===player.y);if(e){setup(e.target,[e.tx,e.ty]);showToast('已抵達 '+names[e.target])}}stepAcc=0;break}}}
function render(){let cam=camera();c.save();c.translate(-cam.x,-cam.y);for(let y=0;y<H;y++)for(let x=0;x<W;x++)tile(x,y,world[y][x]);for(const d of decor)drawDecor(d);landmarks();sceneDetails();for(const b of buildings)house(b);if(pond)drawPond();for(const [x,y] of trees)tree(x,y);for(const p of props)prop(p);for(const b of banners)lantern(b.x,b.y);
for(const e of exits){let x=e.x*T,y=e.y*T;rect(x+2,y+4,28,25,'#e4cb80');rect(x+5,y+7,22,19,'#577f68');rect(x+11,y+10,10,13,'#f6e9b7');rect(x+14,y+24,4,6,'#745c42')}
let actors=[...npcs.map(n=>({...n,player:false})),{...player,shirt:'#d8a75b',hair:'#3e3330',player:true}].sort((a,b)=>a.y-b.y);for(const a of actors)person(a.x,a.y,a.shirt,a.hair,a.dir||'down',a.walk||0);
let n=near(),e=nearExit();if(!dialog&&(n||e)){let x=(e?e.x:n.x)*T-33,y=(e?e.y:n.y)*T-39;rect(x,y,112,22,'#fff3d2');rect(x+2,y+2,108,18,'#75563d');c.fillStyle='#fff7df';c.font='bold 12px sans-serif';c.fillText(e?'E '+e.label:'E '+n.name+' · 交談',x+6,y+15)}c.restore();rect(0,500,960,40,'#1c382dcb');c.fillStyle='#fff2d1';c.font='bold 17px sans-serif';c.fillText(names[sceneId]+' · 北越像素冒險',22,526);c.font='14px sans-serif';c.fillText('📖 故事 · ✨ 星印 · 野外隨機遇敵',720,526)}
function loop(t){let dt=Math.min(50,t-last);last=t;frameTime=t;update(dt);render();if(toastUntil&&t>toastUntil){document.getElementById('toast').style.display='none';toastUntil=0}requestAnimationFrame(loop)}
setup('hanoi');requestAnimationFrame(loop);
const mapping={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
window.addEventListener('keydown',e=>{let k=mapping[e.key];if(k){keys.add(k);e.preventDefault()}if(e.key==='e'||e.key==='E'||e.key===' '){interact();e.preventDefault()}if(e.key==='j'||e.key==='J'){journal();e.preventDefault()}});window.addEventListener('keyup',e=>{let k=mapping[e.key];if(k)keys.delete(k)});window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(d);b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(d))});document.getElementById('act').addEventListener('click',interact);document.getElementById('close').addEventListener('click',closeDialog);document.getElementById('journalBtn').addEventListener('click',journal);document.getElementById('journalClose').addEventListener('click',()=>document.getElementById('journal').hidden=true);document.getElementById('attackBtn').addEventListener('click',()=>battleTurn('attack'));document.getElementById('guardBtn').addEventListener('click',()=>battleTurn('guard'));document.getElementById('skillBtn').addEventListener('click',()=>battleTurn('skill'));document.getElementById('specialBtn').addEventListener('click',()=>battleTurn('special'));document.getElementById('leaveBtn').addEventListener('click',()=>battleTurn('leave'));
</script></body></html>
