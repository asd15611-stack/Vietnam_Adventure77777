function point(u,v,z=0){const p=iso(u,v,z);return {x:W*.52+(p.x-cam.x)*cam.z,y:H*.50+(p.y-cam.y)*cam.z}}
function poly(ps,fill,stroke=null,line=1){ctx.beginPath();ps.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line*cam.z;ctx.lineJoin='round';ctx.stroke()}}

function line(ps,color,width=1,dash=[]){ctx.beginPath();ps.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=color;ctx.lineWidth=width*cam.z;ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash(dash.map(x=>x*cam.z));ctx.stroke();ctx.setLineDash([])}

function txt(str,p,size,color='#2b5344',align='center',weight=800){ctx.fillStyle=color;ctx.font=`${weight} ${Math.max(6,size*cam.z)}px system-ui,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(str,p.x,p.y)}

const corners=[[-4,-3],[13,-3],[13,11],[-4,11]].map(p=>point(...p));poly(corners,'#9bcf83');
for(let i=0;i<270;i++){let u=seeded(i*3+4)*15-3,v=seeded(i*5+7)*12-1;const q=point(u,v);if(q.x<-10||q.x>W+10||q.y<-15||q.y>H+15)continue;circle(q,1.2+seeded(i+2)*2.6,i%3===0?'#bde3a3':'#78b96b')}
// waterfront is a separate ground zone beyond the neighborhood
poly([[9.7,-.3],[15,-.3],[15,11],[9.7,11]].map(x=>point(...x)),'#64b9c5');
for(let i=0;i<45;i++){let u=10+seeded(i*6)*3,v=seeded(i+13)*10;let q=point(u,v);line([q,{x:q.x+(7+seeded(i)*21)*cam.z,y:q.y}],i%2?'#dbf2dcab':'#a7e2edb9',1.2)}
line([[9.68,-.3],[9.68,11]].map(x=>point(...x)),'#dcd8b1',12);
line([[9.55,-.3],[9.55,11]].map(x=>point(...x)),'#728c76',2);
}

const ps=road.map(x=>point(x.u,x.v));ps.push(point(road[0].u,road[0].v));
line(ps,'#4d6566',75);line(ps,'#e0d4ba',70);line(ps,'#a7ad9d',63);line(ps,'#535968',58);line(ps,'#686b70',52);
// understated in-pavement block marks and occasional directional icon
for(let i=0;i<road.length;i++){const a=point(road[i].u,road[i].v);ellipse(a,14,7,'#aeb2ae70');if(i%2===0){circle(a,2.6,'#e9e8dd')}}
// side streets forming an intersection, under the character route
const extras=[[[3.5,1],[3.5,2],[3.5,4.0]],[[5.5,2],[6.5,2],[6.5,4]],[[5.5,6],[5.5,7.65]]];

}

function roll(){if(moving||rolling||$('modalRoot').firstChild)return;rolling=true;refresh();setNotice('🎲 骰子正在滾動…');const n=1+Math.floor(Math.random()*6),die=$('die');die.classList.add('rolling');let count=0;const timer=setInterval(()=>{count++;die.dataset.v=String(1+Math.floor(Math.random()*6));if(count>=12){clearInterval(timer);die.dataset.v=String(n);die.classList.remove('rolling');rolling=false;log('🎲 小航擲出 '+n+' 點');setNotice('擲出 '+n+' 點，人物沿道路逐格移動…');animateMove(n)}},70)}

function openSave(){modal('💾 存檔與備份',`<p>本遊戲使用獨立的瀏覽器儲存空間，不會覆蓋先前台灣大富翁 V0.4 或北越版的進度。</p><div class="stat">目前位置：第 ${state.position+1} 格<br>現金：${money(state.cash)}<br>已完成擲骰：${state.rolls} 次</div><p>建議先下載 JSON 備份，再重設新局。</p>`,[['⬇ 匯出 JSON',()=>{exportSave();closeModal()}],['⬆ 匯入 JSON',()=>{$('importFile').click();closeModal()}],['重新開始（清除本測試局）',()=>{modal('確認重新開始','<p>只會重設本測試版的遊戲進度，不會影響其他作品。</p>',[['確定重設',()=>{state=fresh();avatar={...road[0],dir:1};selected=null;save();closeModal();focusAvatar(true);refresh();setNotice('新局開始，按 GO 擲骰。')}],['取消',closeModal,'secondary']])},'secondary'],['關閉',closeModal,'secondary']])}
function help(){modal('📖 一分鐘新手教學',`<p><b>1.</b> 按 GO，骰子會轉動並產生 1～6 點。<br><b>2.</b> 人物會沿道路經過每個節點，轉彎也不會跳點。<br><b>3.</b> 到達空地可購買，土地上的「出售」牌會換成小屋。<br><b>4.</b> 點自己的房屋，可花錢升級成住宅樓或商業大樓。<br><b>5.</b> 踩到商會的地產，需要支付過路費。<br><b>6.</b> 拖曳地圖、雙指縮放，或使用定位與全景。</p><p class="stat">目前是立體街區第一階段驗收版，尚未加入股票、卡片商店、多人與完整台灣地圖。</p>`,[['我知道了',closeModal]])}
function openPropertyPicker(){modal('🏠 街區地產',`<p>點選土地名稱可把鏡頭移到那塊土地；買地只能在角色停到對應格時。</p><div class="stat">${parcels.map(p=>{let s=state.plots.find(q=>q.id===p.id);return `<p style="margin:6px 0"><b>${p.id}. ${p.name}</b> · ${s.owner==='none'?'出售中':s.owner==='me'?'我的地產':'商會地產'} · ${['空地','小屋','住宅樓','商業大樓'][s.level]}</p>`}).join('')}</div>`,parcels.map(p=>[p.id+' '+p.name,()=>{closeModal();selected=p.id;let x=iso(p.u,p.v);cam.x=x.x;cam.y=x.y;cam.z=Math.max(.9,cam.z);draw();propertyDialog(p.id)},'secondary']).concat([['關閉',closeModal,'secondary']]))}
function loadFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result),v=obj.data??obj;if(!validSave(v))throw Error('格式不符');state=v;avatar={...road[v.position],dir:1};selected=null;save();focusAvatar(true);refresh();setNotice('已成功匯入存檔，人物與房屋狀態已恢復。')}catch(e){alert('匯入失敗：檔案不是本版支援的存檔。')}};reader.readAsText(file)}
function selectedPoint(x,y){for(let i=hitAreas.length-1;i>=0;i--){let pp=hitAreas[i].p,inside=false;for(let j=0,k=pp.length-1;j<pp.length;k=j++){const a=pp[j],b=pp[k];if(((a.y>y)!=(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y+1e-10)+a.x))inside=!inside}if(inside)return hitAreas[i].id}return null}
function onPointerDown(e){if(e.button!==undefined&&e.button!==0)return;canvas.setPointerCapture(e.pointerId);pointerMap.set(e.pointerId,{x:e.clientX,y:e.clientY});dragging=false;if(pointerMap.size===1){dragStart={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};distStart=null}else if(pointerMap.size===2){let v=[...pointerMap.values()],d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);distStart={d,z:cam.z};dragStart=null}}
function onPointerMove(e){if(!pointerMap.has(e.pointerId))return;pointerMap.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointerMap.size===2&&distStart){let v=[...pointerMap.values()],d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);if(Math.abs(d-distStart.d)>2){setZoom(distStart.z*d/distStart.d);dragging=true}}else if(dragStart){const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;if(Math.abs(dx)+Math.abs(dy)>6)dragging=true;if(dragging){focused=false;cam.x=dragStart.cx-dx/cam.z;cam.y=dragStart.cy-dy/cam.z;draw()}}}
function onPointerUp(e){if(!pointerMap.has(e.pointerId))return;const wasTap=!dragging&&pointerMap.size===1;pointerMap.delete(e.pointerId);if(wasTap){const b=canvas.getBoundingClientRect();const id=selectedPoint(e.clientX-b.left,e.clientY-b.top);if(id&&!moving&&!rolling)propertyDialog(id)}if(pointerMap.size===0){dragStart=null;distStart=null}else if(pointerMap.size===1){const v=[...pointerMap.values()][0];dragStart={x:v.x,y:v.y,cx:cam.x,cy:cam.y}}}
$('goBtn').onclick=roll;$('plotBtn').onclick=openPropertyPicker;$('buildBtn').onclick=()=>{let p=parcels.find(p=>p.id===selected&&state.plots.find(q=>q.id===p.id)?.owner==='me')||parcels.find(p=>state.plots.find(q=>q.id===p.id)?.owner==='me');if(p)propertyDialog(p.id);else setNotice('請先走到出售地塊，購買小屋後才能升級。')};$('saveBtn').onclick=openSave;$('helpBtn').onclick=help;$('mapBtn').onclick=viewOverview;$('overviewBtn').onclick=viewOverview;$('followBtn').onclick=()=>{focused=true;cam.z=W<600?1.14:1.35;focusAvatar(true)};$('resetCamera').onclick=()=>{focused=true;cam.z=W<600?1.14:1.35;focusAvatar(true)};$('zoomIn').onclick=()=>setZoom(cam.z*1.24);$('zoomOut').onclick=()=>setZoom(cam.z/1.24);$('importFile').onchange=e=>loadFile(e.target.files?.[0]);
canvas.addEventListener('pointerdown',onPointerDown);canvas.addEventListener('pointermove',onPointerMove);canvas.addEventListener('pointerup',onPointerUp);canvas.addEventListener('pointercancel',onPointerUp);canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(cam.z*(e.deltaY<0?1.12:.90),e.offsetX,e.offsetY)},{passive:false});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{})}
window.addEventListener('resize',()=>{resize()});load();avatar={...road[state.position],dir:1};cam.z=window.innerWidth<650?1.14:1.45;let q=iso(avatar.u,avatar.v);cam.x=q.x+30;cam.y=q.y+10;resize();refresh();setNotice('這是原創、可操作的立體街區。按 GO 擲骰，或點道路旁的土地。');

window.__SCENE_TEST__={getState:()=>JSON.parse(JSON.stringify(state)),setState:s=>{if(!validSave(s))throw Error('invalid');state=s;avatar={...road[s.position],dir:1};refresh();draw()},setPosition:i=>{if(!Number.isInteger(i)||i<0||i>=road.length)throw Error('invalid position');state.position=i;avatar={...road[i],dir:1};focusAvatar(true);refresh();draw()},buy,upgrade,roll,moveDirect:n=>{if(moving||rolling||n<1||n>6)throw Error('busy or bad step');animateMove(n)},lots:parcels,road,focus:focusAvatar,overview:viewOverview,load,save,select:id=>propertyDialog(id),assetValue};
})();
