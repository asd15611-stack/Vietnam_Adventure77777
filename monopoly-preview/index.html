function makeP(index,ai){return {name:names[index],face:faces[index],id:index,ai,cash:12000,bank:4000,debt:0,pos:0,skip:0,bankrupt:false,cards:index===0?['step','barrier']:['mine'],control:0,spent:0}}
function fresh(humans=1,total=4){return{schema:1,round:1,current:0,phase:'preroll',players:Array.from({length:total},(_,i)=>makeP(i,i>=humans)),land:owners(),logs:['遊戲開始！歡迎來到北越夢幻旅行島。'],pending:null,win:null,turnCount:0}}
function legal(t){return Number.isFinite(t)&&t>=0}function assertSave(o){if(!o||o.schema!==1||!Array.isArray(o.players)||o.players.length<2||o.players.length>4||!Array.isArray(o.land)||o.land.length!==N||!['preroll','decision','ended'].includes(o.phase))throw Error('格式不正確');for(const p of o.players){if(!Number.isInteger(p.pos)||p.pos<0||p.pos>=N||!legal(p.cash)||!legal(p.bank)||!legal(p.debt)||!Array.isArray(p.cards)||p.cards.some(k=>!CARD_INFO[k]))throw Error('角色資料錯誤')}for(const l of o.land){if(!Number.isInteger(l.owner)||l.owner>=o.players.length||l.owner< -1||!Number.isInteger(l.level)||l.level<0||l.level>3)throw Error('地產資料錯誤')}return o}
function save(){if(s){try{storage.setItem(STORE,JSON.stringify(s))}catch(e){console.warn('存檔失敗',e)}}}
function log(txt){if(!s)return;s.logs.unshift(txt);s.logs=s.logs.slice(0,65);save();renderUI()}
function value(p){let v=p.cash+p.bank-p.debt;for(const d of defs){const l=s.land[d.i];if(l.owner===p.id)v+=d.price+Math.round(d.price*.72*l.level)}return v}
function active(){return s.players.filter(p=>!p.bankrupt)}function nextPlayer(){if(s.win!==null)return;s.pending=null;let ix=s.current,tries=0;do{ix=(ix+1)%s.players.length;tries++;if(ix===0)s.round++}while(s.players[ix].bankrupt&&tries<=s.players.length);s.current=ix;s.phase='preroll';s.turnCount++;if(s.round>30){finishByAssets();return}save();renderUI();if(me().ai)setTimeout(aiTurn,400)}
function finishByAssets(){let ranked=active().sort((a,b)=>value(b)-value(a));s.win=ranked[0]?.id??0;s.phase='ended';log('🏆 '+s.players[s.win].name+' 以最高總資產獲勝！');renderUI()}
function ensureFunds(p,amount,auto=false){if(p.cash>=amount)return true;let need=amount-p.cash,draw=Math.min(need,p.bank);p.bank-=draw;p.cash+=draw;if(p.cash>=amount)return true;if(!auto&&!p.ai)return false; // AI only: sell land until sufficient
 for(const d of defs.filter(d=>s.land[d.i].owner===p.id).sort((a,b)=>b.price-a.price)){const l=s.land[d.i];let gain=Math.floor((d.price+d.price*.72*l.level)*.6);l.owner=-1;l.level=0;p.cash+=gain;log(p.name+' 變賣 '+d.name+'，取得 '+money(gain));if(p.cash>=amount)break}return p.cash>=amount}
function bankruptcy(p){p.bankrupt=true;p.cash=0;p.bank=0;p.debt=0;for(const l of s.land)if(l.owner===p.id){l.owner=-1;l.level=0}log('💥 '+p.name+' 破產退出遊戲');if(active().length<=1){s.win=active()[0]?.id??p.id;s.phase='ended';log('🏆 '+s.players[s.win].name+' 獲勝！')}}
function charge(p,amount,reason){amount=Math.max(0,Math.round(amount));if(!ensureFunds(p,amount,true)){bankruptcy(p);return false}p.cash-=amount;log(p.name+' 支付 '+money(amount)+'（'+reason+'）');save();return true}
function sendMoney(from,to,amount,reason){if(charge(from,amount,reason)){to.cash+=amount;log(to.name+' 收到 '+money(amount));return true}return false}
function priceUpgrade(d,l){return Math.round(d.price*(.48+.19*l.level))}function rent(d,l){return d.rent*(1+l.level*1.5+l.level*l.level*.7)}
function buy(d){const l=s.land[d.i],p=me();if(l.owner!==-1||p.cash<d.price)return false;p.cash-=d.price;l.owner=p.id;l.level=0;log('🏠 '+p.name+' 購買 '+d.name+' '+money(d.price));return true}
function upgrade(d){let l=s.land[d.i],p=me(),cost=priceUpgrade(d,l);if(l.owner!==p.id||l.level>=3||p.cash<cost)return false;p.cash-=cost;l.level++;log('🏗️ '+p.name+' 將 '+d.name+' 升到 '+l.level+' 級（'+money(cost)+'）');return true}

function resolveTile(){const p=me(),d=defs[p.pos],l=s.land[d.i];if(p.bankrupt){endAfterMove();return}if(l.mine){l.mine=false;charge(p,900,'踩中地雷');if(p.bankrupt){endAfterMove();return}}if(l.block){l.block=false;p.skip++;log(p.name+' 遇到路障，下回合停留 1 回合')}switch(d.type){case 'property':if(l.owner===-1){if(p.ai){if(p.cash>d.price+2200)buy(d);endAfterMove()}else{modal('購買地產',`到達「${d.name}」，售價 <b>${money(d.price)}</b>，基本租金 ${money(d.rent)}。`,[['購買',()=>{buy(d);closeModal();endAfterMove()}],['略過',()=>{closeModal();endAfterMove()}]]);s.phase='decision'}}else if(l.owner===p.id){if(p.ai){if(l.level<3&&p.cash>priceUpgrade(d,l)+3800)upgrade(d);endAfterMove()}else if(l.level<3){let cost=priceUpgrade(d,l);s.phase='decision';modal('自己的土地',`${d.name}，目前 ${l.level} 級。升級費用 ${money(cost)}，升級後租金 ${money(d.rent*(1+(l.level+1)*1.5+(l.level+1)**2*.7))}。`,[['升級建築',()=>{upgrade(d);closeModal();endAfterMove()}],['不升級',()=>{closeModal();endAfterMove()}]])}else endAfterMove()}else{let owner=s.players[l.owner],fee=rent(d,l);sendMoney(p,owner,fee,d.name+' 過路費');endAfterMove()}break;

function endAfterMove(){s.pending=s.win!==null?null:'done';s.phase=s.win!==null?'ended':'preroll';save();renderUI();if(s.win===null){if(me().ai)setTimeout(nextPlayer,180);else setAction('這回合已完成，請按「結束回合」。',[['結束回合',nextPlayer,'primary'],['查看卡片',cardsDialog,'light']])}}
function moveSteps(steps){
 const p=me();if(!p||busy||!Number.isInteger(steps)||steps<1||steps>6)return;
 busy=true;renderUI();let remaining=steps;
 const SEGMENT_MS=520; // each road node has an actual tween, slower than 115ms jumping
 const walkNext=()=>{
   if(remaining<=0){busy=false;animPos=null;center(true);resolveTile();save();renderUI();return}
   const from=defs[p.pos], nextPos=(p.pos+1)%N, to=defs[nextPos];
   let startTime=null;
   const tween=(now)=>{
     if(startTime===null)startTime=now;
     const progress=Math.min(1,(now-startTime)/SEGMENT_MS);
     const eased=progress*progress*(3-2*progress);
     const x=from.x+(to.x-from.x)*eased, y=from.y+(to.y-from.y)*eased;
     animPos={id:p.id,x,y};camera.x=x;camera.y=y;draw();
     if(progress<1){requestAnimationFrame(tween);return}
     p.pos=nextPos; remaining--;
     if(p.pos===0){p.cash+=1200;log('🎉 '+p.name+' 經過起點，領取 $1,200');if(p.debt>0){const interest=Math.ceil(p.debt*.05);charge(p,interest,'貸款利息 5%')}}
     if(p.bankrupt){busy=false;animPos=null;endAfterMove();return}
     save();requestAnimationFrame(walkNext)
   };
   requestAnimationFrame(tween)
 };
 requestAnimationFrame(walkNext)
}
function roll(){if(!s||s.phase!=='preroll'||s.pending==='done'||busy||s.win!==null)return;let p=me();if(p.skip>0){p.skip--;log('⏳ '+p.name+' 停留，剩餘 '+p.skip+' 回合');endAfterMove();return}let n=p.control||1+Math.floor(Math.random()*6);p.control=0;log('🎲 '+p.name+' 擲出 '+n+' 點');moveSteps(n)}
function useCard(type,target){const p=me();let i=p.cards.indexOf(type);if(i<0||s.phase!=='preroll'||s.pending==='done'||busy)return false;let others=s.players.filter(q=>!q.bankrupt&&q.id!==p.id);let owned=defs.filter(d=>s.land[d.i].owner!==-1&&s.land[d.i].owner!==p.id&&s.land[d.i].level>0);if(type==='swap'&&!others.some(q=>q.id===target))return false;if(type==='demolish'&&!owned.some(d=>d.i===target))return false;if(type==='step'&&(!Number.isInteger(target)||target<1||target>6))return false;p.cards.splice(i,1);if(type==='step'){p.control=target;log(p.name+' 使用控制步數：'+target+' 點')}if(type==='barrier'){s.land[(p.pos+1)%N].block=true;log(p.name+' 在下一個道路節點設置路障')}if(type==='mine'){s.land[(p.pos+1)%N].mine=true;log(p.name+' 在下一個道路節點埋下地雷')}if(type==='demolish'){s.land[target].level--;log(p.name+' 拆除 '+defs[target].name+' 的一級建築')}if(type==='swap'){let q=s.players[target],at=p.pos;p.pos=q.pos;q.pos=at;log(p.name+' 與 '+q.name+' 交換位置')}save();renderUI();return true}
function aiCards(){let p=me();if(!p.ai)return;if(p.cards.includes('step')&&p.cash>6500){let near=[];for(let n=1;n<=6;n++){let d=defs[(p.pos+n)%N];if(d.type==='property'&&s.land[d.i].owner===-1&&p.cash>d.price+1000)near.push(n)}if(near.length)useCard('step',near[0])}if(p.cards.includes('demolish')){let d=defs.find(d=>s.land[d.i].owner!==-1&&s.land[d.i].owner!==p.id&&s.land[d.i].level>=2);if(d)useCard('demolish',d.i)}if(p.cards.includes('mine')&&p.cash>8000)useCard('mine');if(p.cards.includes('barrier')&&p.cash>8000)useCard('barrier')}
function aiTurn(){if(!s||!me().ai||busy||modalOpen||s.win!==null||s.phase!=='preroll'||s.pending==='done')return;aiCards();setTimeout(()=>{if(s&&me().ai&&s.phase==='preroll')roll()},300)}
function start(h,t,chosen=null,customNames=null){s=fresh(h,t);const used=Array.isArray(chosen)&&chosen.length===t?chosen:Array.from({length:t},(_,i)=>i);s.players.forEach((p,i)=>{const idx=Number(used[i]);p.charId=Number.isInteger(idx)&&idx>=0&&idx<8?idx:i%8;p.name=(Array.isArray(customNames)&&String(customNames[i]||'').trim().slice(0,12))||CHAR_NAMES[p.charId];p.face='🎒'});busy=false;closeModal();log('開始新遊戲：'+h+' 人真人，'+(t-h)+' 名 AI');center();renderUI();if(me().ai)setTimeout(aiTurn,500)}

function bankDialog(tile){if(!s||!isHuman()||busy||s.pending==='done')return;const p=me();const html=`<p>現金 <b>${money(p.cash)}</b> · 存款 <b>${money(p.bank)}</b> · 欠款 <b>${money(p.debt)}</b></p><label>金額（整數）<input class="field" type="number" id="amt" min="100" step="100" value="1000"></label><p class="small">貸款最多 $8,000，每次經過起點會自動收取未償還貸款的 5% 利息。借款立即入現金；償還減少欠款。</p>`;modal('🏦 中央銀行',html,[['存款',()=>bankOp('deposit',tile)],['提款',()=>bankOp('withdraw',tile)],['貸款',()=>bankOp('borrow',tile)],['還款',()=>bankOp('repay',tile)],['完成',()=>{closeModal();tile?endAfterMove():renderUI()},'light']])}
function bankOp(type,tile){let p=me(),n=Math.floor(Number($('amt').value));if(!Number.isFinite(n)||n<100||n%100!==0){alert('請輸入 100 的倍數');return}let ok=false;if(type==='deposit'&&p.cash>=n){p.cash-=n;p.bank+=n;ok=true}if(type==='withdraw'&&p.bank>=n){p.cash+=n;p.bank-=n;ok=true}if(type==='borrow'&&p.debt+n<=8000){p.debt+=n;p.cash+=n;ok=true}if(type==='repay'&&p.cash>=n&&p.debt>=n){p.cash-=n;p.debt-=n;ok=true}if(!ok){alert('金額超出可用範圍');return}log(p.name+' 銀行操作：'+({deposit:'存款',withdraw:'提款',borrow:'貸款',repay:'還款'}[type])+money(n));bankDialog(tile)}
